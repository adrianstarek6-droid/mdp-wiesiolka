<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>MDP WIESIÓŁKA</title>

<style>
:root{--red:#d71920;--dark:#0b0d11;--card:#171a20;--line:#303641;--muted:#9ba2ad;--green:#29b66b;--yellow:#d6a52e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% -10%,#421014,#0b0d11 38%);color:#fff;font-family:Arial,Inter,sans-serif}
header{background:linear-gradient(125deg,#720a0f,#d71920 55%,#970e14);padding:18px 16px;position:sticky;top:0;z-index:5}
.brand{max-width:1080px;margin:auto;display:flex;align-items:center;gap:13px}
.logo{width:52px;height:52px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:28px}
.brand h1{font-size:21px;margin:0}
.brand p{margin:3px 0 0;color:#ffd8da;font-size:13px}
main{max-width:1080px;margin:auto;padding:18px 14px 50px}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}
.tabs button{white-space:nowrap;border:0;background:#20252e;color:#ddd;padding:11px 14px;border-radius:12px;font-weight:800}
.tabs button.active{background:var(--red);color:#fff}
.tab{display:block}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.wide{grid-column:1/-1}
.card{background:linear-gradient(145deg,#191c23,#13161b);border:1px solid var(--line);border-radius:19px;padding:18px;box-shadow:0 10px 35px #0004}
h2{margin:0 0 6px}
h3{margin:0 0 8px}
.muted{color:var(--muted);font-size:14px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}
.q{background:#181c23;border:1px solid #303641;border-radius:15px;padding:14px}
.q b{display:block;font-size:23px;margin-top:5px}
.q span{font-size:12px;color:var(--muted)}
.event{border-bottom:1px solid #30343d;padding:16px 0}
.event:last-child{border:0}
.eventtop{display:flex;justify-content:space-between;gap:12px}
.badge{font-size:11px;font-weight:900;padding:6px 9px;border-radius:99px;background:#292e37;height:max-content}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button,.primary,.danger,.secondary{border:0;border-radius:10px;padding:10px 13px;color:#fff;font-weight:800;cursor:pointer}
.yes{background:#218c55}
.no,.danger{background:#9e252b}
.maybe{background:#856d1d}
.primary{background:var(--red)}
.secondary{background:#2a3039}
.danger.small,.secondary.small{padding:7px 10px;font-size:12px}
.notice{display:flex;gap:10px;background:#251b1d;border:1px solid #4a292c;border-radius:13px;padding:12px;margin-top:12px}
.notice b{font-size:13px}
.notice span{font-size:12px;color:#adb3bd}
.ann{padding:14px 0;border-bottom:1px solid #30343d}
.ann:last-child{border:0}
.ann .meta{font-size:11px;color:#858c97}
.ann h3{margin-top:5px}
.bell{position:relative}
.count{position:absolute;top:-5px;right:-4px;background:#fff;color:#d71920;border-radius:99px;font-size:9px;min-width:17px;height:17px;display:grid;place-items:center}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.day{min-height:64px;border:1px solid #292e37;background:#14171c;border-radius:9px;padding:6px;color:#aeb4bd;text-align:left;cursor:pointer}
.day.head{border:0;background:transparent;text-align:center;min-height:25px;cursor:default;color:#777e89}
.day.empty{opacity:.2;cursor:default}
.day b{display:block;color:#fff}
.day span{display:block;color:#ff7277;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.day.eventday{border-color:#bd1a21;background:#291518}
.day:hover{border-color:#d71920}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #363b46;background:#101318;color:#fff;margin:6px 0 12px}
label{font-size:13px;color:#bbb}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(circle at 50% 0,#551217,#0b0d11 45%)}
.login-card{width:min(430px,100%);background:#171a20;border:1px solid #353a44;border-radius:24px;padding:30px;box-shadow:0 25px 80px #0009;text-align:center}
.login-logo{width:76px;height:76px;border-radius:22px;background:#fff;color:#c5161d;display:grid;place-items:center;font-size:40px;margin:0 auto 18px}
.kicker{font-size:11px;font-weight:900;letter-spacing:1.3px;color:#ef555b}
