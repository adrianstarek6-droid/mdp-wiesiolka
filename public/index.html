  </div>    <div id="toastContainer"></div>    <script>  
    /* =========================================================  
       MDP WIESIÓŁKA  
       FRONTEND  
    ========================================================= */  
  
    const state = {  
      role: localStorage.getItem("mdpRole") || "",  
      code: localStorage.getItem("mdpCode") || "",  
      memberId: localStorage.getItem("mdpMemberId") || "",  
      member: null,  
  
      events: [],  
      news: [],  
      members: [],  
      stats: null,  
  
      notifications: []  
    };  
  
    let currentSection = "home";  
  
  
    /* =========================================================  
       HELPERS  
    ========================================================= */  
  
    function escapeHTML(value) {  
      return String(value ?? "")  
        .replaceAll("&", "&amp;")  
        .replaceAll("<", "&lt;")  
        .replaceAll(">", "&gt;")  
        .replaceAll('"', "&quot;")  
        .replaceAll("'", "&#039;");  
    }  
  
    function normalize(value) {  
      return String(value || "")  
        .trim()  
        .toLowerCase()  
        .normalize("NFD")  
        .replace(/[\u0300-\u036f]/g, "");  
    }  
  
    function roleName(role) {  
      const roles = {  
        member: "Członek MDP",  
        guardian: "Opiekun MDP",  
        admin: "Administrator"  
      };  
  
      return roles[role] || "Użytkownik";  
    }  
  
    function isStaff() {  
      return state.role === "guardian" || state.role === "admin";  
    }  
  
    function authHeaders() {  
      const headers = {  
        "Content-Type": "application/json",  
        "x-role": state.role,  
        "x-code": state.code  
      };  
  
      if (state.memberId) {  
        headers["x-member-id"] = state.memberId;  
      }  
  
      return headers;  
    }  
  
    async function api(url, options = {}) {  
      const finalOptions = {  
        ...options,  
        headers: {  
          ...authHeaders(),  
          ...(options.headers || {})  
        }  
      };  
  
      const response = await fetch(url, finalOptions);  
  
      let data = null;  
  
      try {  
        data = await response.json();  
      } catch {  
        data = null;  
      }  
  
      if (!response.ok) {  
        throw new Error(  
          data?.error ||  
          data?.message ||  
          `Błąd serwera (${response.status})`  
        );  
      }  
  
      return data;  
    }  
  
    function showToast(message, error = false) {  
      const container = document.getElementById("toastContainer");  
  
      const toast = document.createElement("div");  
      toast.className = "toast " + (error ? "error" : "success");  
      toast.textContent = message;  
  
      container.appendChild(toast);  
  
      setTimeout(() => {  
        toast.remove();  
      }, 3200);  
    }  
  
    function formatDate(dateValue) {  
      if (!dateValue) return "Brak daty";  
  
      const date = new Date(dateValue);  
  
      if (Number.isNaN(date.getTime())) {  
        return String(dateValue);  
      }  
  
      return date.toLocaleDateString("pl-PL", {  
        day: "2-digit",  
        month: "2-digit",  
        year: "numeric"  
      });  
    }  
  
    function formatDateTime(dateValue, timeValue = "") {  
      return `${formatDate(dateValue)}${timeValue ? " • " + escapeHTML(timeValue) : ""}`;  
    }  
  
    function initials(firstName, lastName) {  
      const a = String(firstName || "").trim()[0] || "";  
      const b = String(lastName || "").trim()[0] || "";  
  
      return (a + b).toUpperCase() || "👤";  
    }  
  
    function getMemberName(member) {  
      if (!member) return "";  
  
      if (member.first_name || member.last_name) {  
        return `${member.first_name || ""} ${member.last_name || ""}`.trim();  
      }  
  
      return member.name || "";  
    }  
  
    function eventTitle(event) {  
      return event.title || event.name || "Zbiórka MDP";  
    }  
  
    function eventDescription(event) {  
      return event.description || event.details || "";  
    }  
  
    function eventLocation(event) {  
      return event.location || event.place || "";  
    }  
  
    function newsTitle(item) {  
      return item.title || "Ogłoszenie";  
    }  
  
    function newsContent(item) {  
      return item.content || item.text || item.description || "";  
    }  
  
  
    /* =========================================================  
       LOGIN  
    ========================================================= */  
  
    let selectedLoginRole = "member";  
  
    document.querySelectorAll(".role-btn").forEach(button => {  
      button.addEventListener("click", () => {  
  
        document  
          .querySelectorAll(".role-btn")  
          .forEach(btn => btn.classList.remove("active"));  
  
        button.classList.add("active");  
  
        selectedLoginRole = button.dataset.role;  
  
        const memberFields =  
          document.getElementById("memberLoginFields");  
  
        if (selectedLoginRole === "member") {  
          memberFields.classList.remove("hidden");  
        } else {  
          memberFields.classList.add("hidden");  
        }  
  
        document.getElementById("loginError").style.display = "none";  
      });  
    });  
  
  
    document.getElementById("loginBtn").addEventListener("click", login);  
  
    document  
      .getElementById("loginCode")  
      .addEventListener("keydown", event => {  
        if (event.key === "Enter") {  
          login();  
        }  
      });  
  
    async function login() {  
  
      const errorBox = document.getElementById("loginError");  
      const button = document.getElementById("loginBtn");  
  
      errorBox.style.display = "none";  
      button.disabled = true;  
      button.textContent = "Logowanie...";  
  
      try {  
  
        const code =  
          document.getElementById("loginCode").value.trim();  
  
        if (!code) {  
          throw new Error("Wpisz kod dostępu.");  
        }  
  
        let payload = {  
          role: selectedLoginRole,  
          code  
        };  
  
        if (selectedLoginRole === "member") {  
  
          const firstName =  
            document.getElementById("loginFirstName").value.trim();  
  
          const lastName =  
            document.getElementById("loginLastName").value.trim();  
  
          if (!firstName || !lastName) {  
            throw new Error("Wpisz imię i nazwisko.");  
          }  
  
          payload.firstName = firstName;  
          payload.lastName = lastName;  
        }  
  
        const response = await fetch("/api/login", {  
          method: "POST",  
          headers: {  
            "Content-Type": "application/json"  
          },  
          body: JSON.stringify(payload)  
        });  
  
        const data = await response.json();  
  
        if (!response.ok) {  
          throw new Error(  
            data?.error ||  
            data?.message ||  
            "Nieprawidłowe dane logowania."  
          );  
        }  
  
        state.role = selectedLoginRole;  
        state.code = code;  
  
        localStorage.setItem("mdpRole", state.role);  
        localStorage.setItem("mdpCode", state.code);  
  
        if (selectedLoginRole === "member") {  
  
          if (!data.member) {  
            throw new Error("Serwer nie zwrócił danych członka.");  
          }  
  
          state.member = data.member;  
          state.memberId = String(data.member.id);  
  
          localStorage.setItem(  
            "mdpMemberId",  
            state.memberId  
          );  
  
          localStorage.setItem(  
            "mdpMember",  
            JSON.stringify(data.member)  
          );  
  
        } else {  
  
          state.member = null;  
          state.memberId = "";  
  
          localStorage.removeItem("mdpMemberId");  
          localStorage.removeItem("mdpMember");  
        }  
  
        await startApp();  
  
        showToast("Zalogowano pomyślnie.");  
  
      } catch (error) {  
  
        errorBox.textContent =  
          error.message || "Nie udało się zalogować.";  
  
        errorBox.style.display = "block";  
  
      } finally {  
  
        button.disabled = false;  
        button.textContent = "Zaloguj się";  
      }  
      }
        /* =========================================================  
       START APP  
    ========================================================= */  

    async function startApp() {  

      document.getElementById("loginScreen").classList.add("hidden");  
      document.getElementById("app").classList.remove("hidden");  

      updateTopbar();  
      updateManagementVisibility();  

      try {  

        await loadData();  

        if (state.role === "member") {  
          await loadProfile();  
        }  

        renderAll();  

      } catch (error) {  

        console.error(error);  

        showToast(  
          "Nie udało się pobrać danych aplikacji.",  
          true  
        );  

        renderAll();  
      }  
    }  


    async function loadData() {  

      const data = await api("/api/data");  

      state.events = Array.isArray(data.events)  
        ? data.events  
        : [];  

      state.news = Array.isArray(data.news)  
        ? data.news  
        : [];  

      state.members = Array.isArray(data.members)  
        ? data.members  
        : [];  

      if (data.stats) {  
        state.stats = data.stats;  
      }  

      return data;  
    }  


    async function loadProfile() {  

      try {  

        const data = await api("/api/profile");  

        if (data.member) {  
          state.member = data.member;  

          localStorage.setItem(  
            "mdpMember",  
            JSON.stringify(data.member)  
          );  
        }  

      } catch (error) {  

        console.warn("Profile:", error);  
      }  
    }

      let name = roleName(state.role);

    function updateManagementVisibility() {  

      const managementNav =  
        document.querySelector('[data-section="management"]');

          isStaff() ? "" : "none";  
      }

    /* =========================================================  
       NAVIGATION  
    ========================================================= */  

    document.querySelectorAll(".nav-btn").forEach(button => {  

      button.addEventListener("click", () => {  

        showSection(button.dataset.section);  

      });  

    });  


    function showSection(section) {  

      if (section === "management" && !isStaff()) {  
        return;  
      }  

      currentSection = section;  

      document  
        .querySelectorAll(".section")  
        .forEach(el => el.classList.remove("active"));  

      const target =  
        document.getElementById("section-" + section);  

      if (target) {  
        target.classList.add("active");  
      }  

      document  
        .querySelectorAll(".nav-btn")  
        .forEach(btn => {  
          btn.classList.toggle(  
            "active",  
            btn.dataset.section === section  
          );  
        });  

      window.scrollTo({  
        top: 0,  
        behavior: "smooth"  
      });  

      if (section === "stats") {  
        renderStats();  
      }  

      if (section === "profile") {  
        renderProfile();  
      }  

      if (section === "notifications") {  
        renderNotifications();  
      }  
    }

    function getSortedEvents() {  

      return [...state.events].sort((a, b) => {  

        const da = new Date(  
          `${a.date || ""}T${a.time || "00:00"}`  
        );  

        const db = new Date(  
          `${b.date || ""}T${b.time || "00:00"}`  
        );  

        return da - db;  
      });  
    }  


    function getNextEvent() {  

      const now = new Date();  

      return getSortedEvents().find(event => {  

        if (!event.date) return true;  

        const date = new Date(  
          `${event.date}T${event.time || "23:59"}`  
        );  

        return date >= now;  

      }) || null;  
    }

    function isEventPast(event) {  

      if (!event.date) return false;  

      const date = new Date(  
        `${event.date}T${event.time || "23:59"}`  
      );  

      return date < new Date();  
    }  


    /* =========================================================

    ========================================================= */  

    async function setAttendance(eventId, status) {  

      if (state.role !== "member") {  
        showToast("Tylko członek MDP może ustawić obecność.", true);  
        return;  
      }  

      try {  

        await api("/api/attendance", {  
          method: "POST",  
          body: JSON.stringify({  
            event_id: eventId,  
            status  
          })  
        });  

        const labels = {  
          yes: "Będę",  
          maybe: "Może",  
          no: "Nie będę"  
        };  

        showToast(  
          `Twoja odpowiedź: ${labels[status]}.`  
        );  

        await loadData();  

        renderAll();  

      } catch (error) {  

        showToast(  
          error.message || "Nie udało się zapisać obecności.",  
          true  
        );  
      }  
    }  


    async function showAttendance(eventId) {  

      if (!isStaff()) return;  

      try {  

        const rows =  
          await api(`/api/attendance/${eventId}`);  

        let list = [];  

        if (Array.isArray(rows)) {  
          list = rows;  
        } else if (Array.isArray(rows?.attendance)) {  
          list = rows.attendance;  
        } else if (Array.isArray(rows?.rows)) {  
          list = rows.rows;  
        }  

        if (!list.length) {  

          openModal(  
            "Lista obecności",  
            `  
              <div class="empty">  
                <div class="empty-icon">👥</div>  
                <strong>Brak odpowiedzi</strong>  
                <p>Nikt jeszcze nie zadeklarował obecności.</p>  
              </div>  
            `  
          );  

          return;  
        }  

        const statusInfo = {  
          yes: ["🟢", "Będę", "badge-green"],  
          maybe: ["🟡", "Może", "badge-yellow"],  
          no: ["🔴", "Nie będę", "badge-red"]  
        };  

        openModal(  
          "Lista obecności",  
          `  
            <div class="list">  

              ${list.map(row => {  

                const status =  
                  statusInfo[row.status] ||  
                  ["⚪", "Brak", "badge-gray"];  

                return `  
                  <div class="item-card">  

                    <div class="item-top">  

                      <strong>  
                        ${escapeHTML(  
                          row.member_name ||  
                          row.name ||  
                          "Członek"  
                        )}  
                      </strong>  

                      <span class="badge ${status[2]}">  
                        ${status[0]} ${status[1]}  
                      </span>  

                    </div>  

                  </div>  
                `;  

              }).join("")}  

            </div>  
          `  
        );  

      } catch (error) {  

        showToast(  
          error.message || "Nie udało się pobrać obecności.",  
          true  
        );  
      }  
        }

      if (!file.type.startsWith("image/")) {  

        showToast(

        return;  
      }  

      try {  

        showToast("Przygotowywanie zdjęcia...");

          await compressImage(file);  

        const formData =  
          new FormData();  

        formData.append(

          await fetch(

          true  
        );  
      }  
    }  


    function compressImage(file) {  

      return new Promise(  
        (resolve, reject) => {  

          const reader =  
            new FileReader();  

          reader.onload = event => {  

            const image =  
              new Image();  

            image.onload = () => {  

              const maxSize = 900;  

              let width =  
                image.width;  

              let height =  
                image.height;  

              if (  
                width > maxSize ||  
                height > maxSize  
              ) {  

                if (width > height) {  

                  height =  
                    Math.round(  
                      height *  
                      maxSize /  
                      width  
                    );  

                  width =  
                    maxSize;  

                } else {  

                  width =  
                    Math.round(  
                      width *  
                      maxSize /  
                      height  
                    );  

                  height =  
                    maxSize;  
                }  
              }  

              const canvas =  
                document.createElement(  
                  "canvas"  
                );  

              canvas.width =  
                width;  

              canvas.height =  
                height;  

              const ctx =  
                canvas.getContext(  
                  "2d"  
                );  

              ctx.drawImage(  
                image,  
                0,  
                0,  
                width,  
                height  
              );  

              canvas.toBlob(  
                blob => {  

                  if (!blob) {  
                    reject(  
                      new Error(  
                        "Nie udało się przygotować zdjęcia."  
                      )  
                    );  
                    return;  
                  }  

                  resolve(blob);  

                },  
                "image/jpeg",  
                0.85  
              );  

            };  

            image.onerror =  
              () =>  
                reject(  
                  new Error(  
                    "Nie udało się odczytać zdjęcia."  
                  )  
                );  

            image.src =  
              event.target.result;  
          };  

          reader.onerror =  
            () =>  
              reject(  
                new Error(  
                  "Nie udało się odczytać pliku."  
                )  
              );  

          reader.readAsDataURL(file);  
        }  
      );  
    }

    function createNotifications() {  

      const notifications = [];  

      const nextEvent =  
        getSortedEvents()  
          .find(event => !isEventPast(event));  

      if (nextEvent) {  

        notifications.push({  
          icon: "📅",  
          title: "Najbliższa zbiórka",  
          text:  
            `${eventTitle(nextEvent)} • ${formatDate(nextEvent.date)}${nextEvent.time ? " • " + nextEvent.time : ""}`,  
          date: "Aktualne"  
        });  
      }  

      const latest =  
        [...state.news].sort((a, b) => {  

          const da = new Date(  
            a.created_at ||  
            a.createdAt ||  
            0  
          );  

          const db = new Date(  
            b.created_at ||  
            b.createdAt ||  
            0  
          );  

          return db - da;  

        })[0];  

      if (latest) {  

        notifications.push({  
          icon: "📢",  
          title: "Najnowsze ogłoszenie",  
          text: newsTitle(latest),  
          date:  
            latest.created_at ||  
            latest.createdAt  
              ? formatDate(  
                  latest.created_at ||  
                  latest.createdAt  
                )  
              : "Aktualne"  
        });  
      }  

      state.notifications =  
        notifications;  
    }  


    function renderNotifications() {  

      createNotifications();  

      const container =  
        document.getElementById(  
          "notificationsList"  
        );  

      if (!container) return;  

      if (!state.notifications.length) {  

        container.innerHTML = `

    async function updatePushButton() {

      ) {

            <h3>  
              🔔 Powiadomienia są włączone  
            </h3>

        `;  

      } else {  

        container.innerHTML = `  
          <div class="push-card">  

            <h3>  
              🔔 Włącz powiadomienia  
            </h3>  

            <p>  
              Dzięki nim możesz otrzymywać ważne  
              informacje bez otwierania aplikacji.  
            </p>  

            <button  
              class="small-btn"

            >

        `;  
      }  
    }  


    async function enablePush() {  

      try {  

        if (  
          !("Notification" in window)  
        ) {  

          showToast(  
            "Ta przeglądarka nie obsługuje powiadomień.",  
            true  
          );  

          return;  
        }  

        const permission =  
          await Notification.requestPermission();  

        if (  
          permission !== "granted"  
        ) {  

          showToast(  
            "Powiadomienia nie zostały włączone.",  
            true  
          );  

          return;  
        }  

        if (  
          !("serviceWorker" in navigator)  
        ) {  

          showToast(  
            "Ta przeglądarka nie obsługuje Service Workera.",  
            true  
          );  

          return;  
        }  

        const registration =  
          await navigator.serviceWorker.ready;  

        if (  
          !("PushManager" in window)  
        ) {  

          showToast(  
            "Powiadomienia push nie są obsługiwane.",  
            true  
          );  

          return;  
        }  

        const subscription =  
          await registration  
            .pushManager  
            .getSubscription();  

        if (!subscription) {  

          showToast(  
            "Uprawnienie do powiadomień zostało włączone."  
          );  

        } else {  

          try {  

            await api(  
              "/api/push/subscribe",  
              {  
                method: "POST",  
                body: JSON.stringify({  
                  subscription  
                })  
              }  
            );  

            showToast(  
              "Powiadomienia zostały aktywowane."  
            );  

          } catch {  

            showToast(  
              "Powiadomienia zostały włączone na urządzeniu."  
            );  
          }  
        }  

        updatePushButton();  

      } catch (error) {  

        showToast(  
          error.message ||  
          "Nie udało się włączyć powiadomień.",  
          true  
        );  
      }  
    }

    async function restoreSession() {  

      const role =  
        localStorage.getItem(  
          "mdpRole"  
        );  

      const code =  
        localStorage.getItem(  
          "mdpCode"  
        );  

      if (!role || !code) {  
        return;  
      }  

      state.role = role;  
      state.code = code;  

      if (role === "member") {  

        state.memberId =  
          localStorage.getItem(  
            "mdpMemberId"  
          ) || "";  

        try {  

          const saved =  
            localStorage.getItem(  
              "mdpMember"  
            );  

          if (saved) {  

            state.member =  
              JSON.parse(saved);  
          }  

        } catch {  

          state.member = null;  
        }  
      }  

      try {  

        await startApp();  

      } catch {  

        logout();  
      }  
    }
