<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>MDP OSP Wiesiółka</title>

<meta name="theme-color" content="#d71920">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MDP Wiesiółka">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#090909;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at top,#3b1010 0,#090909 48%);
}

.login-box{
  width:100%;
  max-width:430px;
  background:#151515;
  border:1px solid #292929;
  border-radius:28px;
  padding:28px 22px;
  box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.logo{
  width:88px;
  height:88px;
  margin:0 auto 18px;
  display:block;
  object-fit:contain;
}

.login-title{
  text-align:center;
  margin:0;
  font-size:28px;
  font-weight:900;
}

.login-subtitle{
  text-align:center;
  color:#999;
  margin:8px 0 26px;
}

.role-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:16px;
}

.role-button{
  border:1px solid #333;
  background:#202020;
  color:#aaa;
  border-radius:14px;
  padding:12px 5px;
  font-size:12px;
  font-weight:800;
}

.role-button.active{
  background:#d71920;
  border-color:#d71920;
  color:#fff;
}

.input{
  width:100%;
  border:1px solid #333;
  background:#0e0e0e;
  color:#fff;
  border-radius:14px;
  padding:15px;
  outline:none;
}

.input:focus{
  border-color:#d71920;
}

.login-button{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:14px;
  padding:15px;
  background:#d71920;
  color:#fff;
  font-weight:900;
}

.login-error{
  color:#ff6464;
  text-align:center;
  margin-top:12px;
  font-size:13px;
}

/* =========================
   APP
========================= */

#app{
  min-height:100vh;
  padding-bottom:90px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(9,9,9,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid #222;
  padding:14px 16px;
}

.topbar-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand img{
  width:38px;
  height:38px;
  object-fit:contain;
}

.brand-text strong{
  display:block;
  font-size:14px;
}

.brand-text span{
  display:block;
  color:#888;
  font-size:11px;
  margin-top:2px;
}

.top-role{
  font-size:11px;
  font-weight:800;
  background:#222;
  padding:8px 10px;
  border-radius:20px;
  color:#ddd;
}

.main{
  max-width:900px;
  margin:auto;
  padding:18px 16px 30px;
}

/* =========================
   DASHBOARD
========================= */

.greeting{
  margin-bottom:18px;
}

.greeting small{
  color:#999;
}

.greeting h1{
  margin:5px 0 0;
  font-size:27px;
}

.hero{
  background:
    linear-gradient(135deg,#d71920,#810e13);
  border-radius:24px;
  padding:22px;
  box-shadow:0 15px 40px rgba(215,25,32,.2);
  margin-bottom:16px;
}

.hero-label{
  opacity:.8;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
}

.hero h2{
  margin:7px 0;
  font-size:24px;
}

.hero p{
  margin:5px 0;
  opacity:.9;
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:18px;
}

.card{
  background:#151515;
  border:1px solid #282828;
  border-radius:20px;
  padding:17px;
}

.card-icon{
  font-size:25px;
}

.card-number{
  font-size:24px;
  font-weight:900;
  margin-top:9px;
}

.card-label{
  color:#888;
  font-size:12px;
  margin-top:3px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:24px 0 12px;
}

.section-title h2{
  margin:0;
  font-size:18px;
}

.section-title span{
  color:#777;
  font-size:12px;
}

/* =========================
   EVENTS
========================= */

.event{
  background:#151515;
  border:1px solid #282828;
  border-radius:20px;
  padding:17px;
  margin-bottom:12px;
}

.event-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.event-date{
  color:#d71920;
  font-size:12px;
  font-weight:900;
}

.event h3{
  margin:7px 0 5px;
  font-size:18px;
}

.event p{
  color:#aaa;
  margin:4px 0;
  font-size:13px;
}

.event-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:13px;
}

.btn{
  border:1px solid #333;
  background:#222;
  color:#fff;
  border-radius:11px;
  padding:10px 12px;
  font-size:12px;
  font-weight:800;
}

.btn.red{
  background:#d71920;
  border-color:#d71920;
}

.btn.green{
  background:#174d2b;
  border-color:#276e3e;
}

.btn.yellow{
  background:#5c4812;
  border-color:#82661b;
}

.btn.gray{
  background:#252525;
}

.btn.danger{
  background:#5a1518;
  border-color:#7e1e23;
}

/* =========================
   NEWS
========================= */

.news{
  background:#151515;
  border:1px solid #282828;
  border-radius:20px;
  padding:17px;
  margin-bottom:12px;
}

.news-date{
  color:#777;
  font-size:11px;
}

.news h3{
  margin:6px 0;
}

.news p{
  color:#aaa;
  font-size:13px;
  line-height:1.5;
  margin:0;
}

/* =========================
   PROFILE
========================= */

.profile-head{
  background:linear-gradient(135deg,#191919,#101010);
  border:1px solid #292929;
  border-radius:24px;
  padding:22px;
  text-align:center;
}

.avatar{
  width:82px;
  height:82px;
  border-radius:50%;
  background:#d71920;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 13px;
  font-size:32px;
  font-weight:900;
}

.profile-head h2{
  margin:5px 0;
}

.profile-head p{
  color:#888;
  margin:5px 0;
}

.profile-info{
  margin-top:14px;
  display:grid;
  gap:9px;
}

.info-row{
  background:#151515;
  border:1px solid #292929;
  border-radius:14px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.info-row span:first-child{
  color:#888;
}

/* =========================
   MEMBERS
========================= */

.member{
  display:flex;
  align-items:center;
  gap:12px;
  background:#151515;
  border:1px solid #282828;
  border-radius:17px;
  padding:13px;
  margin-bottom:9px;
}

.member-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#292929;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.member-name{
  font-weight:800;
}

.member-role{
  color:#888;
  font-size:11px;
  margin-top:3px;
}

/* =========================
   ADMIN
========================= */

.admin-box{
  background:#151515;
  border:1px solid #3d2525;
  border-radius:20px;
  padding:17px;
  margin-bottom:13px;
}

.admin-title{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:14px;
}

.admin-title h3{
  margin:0;
}

.form-grid{
  display:grid;
  gap:9px;
}

textarea.input{
  min-height:100px;
  resize:vertical;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#777;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  background:rgba(12,12,12,.96);
  backdrop-filter:blur(15px);
  border-top:1px solid #252525;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}

.nav-inner{
  max-width:650px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  border:0;
  background:transparent;
  color:#777;
  padding:7px 3px;
  font-size:10px;
  font-weight:800;
}

.nav-btn span{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.nav-btn.active{
  color:#fff;
}

.nav-btn.active span{
  filter:drop-shadow(0 0 7px rgba(215,25,32,.5));
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
}

.modal-box{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:#151515;
  border:1px solid #303030;
  border-radius:25px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#292929;
  color:#fff;
  font-size:20px;
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:700px){
  .cards{
    grid-template-columns:repeat(4,1fr);
  }

  .modal{
    align-items:center;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen">

  <div class="login-box">

    <img class="logo" src="./icon-192.png" alt="MDP OSP Wiesiółka">

    <h1 class="login-title">MDP OSP Wiesiółka</h1>
    <p class="login-subtitle">Zaloguj się do aplikacji</p>

    <div class="role-buttons">

      <button class="role-button active" data-role="member" onclick="chooseRole('member')">
        👨‍🚒<br>Członek
      </button>

      <button class="role-button" data-role="guardian" onclick="chooseRole('guardian')">
        🧑‍🚒<br>Opiekun
      </button>

      <button class="role-button" data-role="admin" onclick="chooseRole('admin')">
        🛡️<br>Admin
      </button>

    </div>

    <input
      id="loginCode"
      class="input"
      type="password"
      inputmode="numeric"
      placeholder="Kod dostępu"
      maxlength="20"
    >

    <button class="login-button" onclick="login()">
      ZALOGUJ SIĘ
    </button>

    <div id="loginError" class="login-error"></div>

  </div>

</section>


<!-- =========================
     APP
========================= -->

<section id="app" class="hidden">

  <header class="topbar">

    <div class="topbar-inner">

      <div class="brand">

        <img src="./icon-192.png" alt="OSP">

        <div class="brand-text">
          <strong>MDP OSP Wiesiółka</strong>
          <span id="topUserName">Użytkownik</span>
        </div>

      </div>

      <div id="topRole" class="top-role">
        CZŁONEK
      </div>

    </div>

  </header>


  <main id="mainContent" class="main"></main>


  <nav class="bottom-nav">

    <div class="nav-inner">

      <button class="nav-btn active" data-page="home" onclick="showPage('home')">
        <span>🏠</span>
        Start
      </button>

      <button class="nav-btn" data-page="events" onclick="showPage('events')">
        <span>📅</span>
        Zbiórki
      </button>

      <button class="nav-btn" data-page="news" onclick="showPage('news')">
        <span>📢</span>
        Info
      </button>

      <button class="nav-btn" data-page="members" onclick="showPage('members')">
        <span>👥</span>
        MDP
      </button>

      <button class="nav-btn" data-page="profile" onclick="showPage('profile')">
        <span>👤</span>
        Profil
      </button>

    </div>

  </nav>

</section>


<!-- =========================
     MODAL
========================= -->

<div id="modal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-head">
      <h2 id="modalTitle">Dodaj</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div id="modalContent"></div>

  </div>

</div>


<script>

/* =========================================================
   DANE
========================================================= */

const CODES = {
  member: "2018",
  guardian: "9982018",
  admin: "0000"
};

let currentRole = "member";

let currentUser = {
  name: "Członek MDP",
  role: "member"
};


/* =========================================================
   LOCAL STORAGE
========================================================= */

const defaultData = {

  events: [
    {
      id: 1,
      title: "Zbiórka MDP",
      date: "2026-10-03",
      time: "17:00",
      place: "Remiza OSP Wiesiółka",
      description: "Regularna zbiórka Młodzieżowej Drużyny Pożarniczej.",
      attendance: {}
    }
  ],

  news: [
    {
      id: 1,
      title: "Witamy w aplikacji MDP!",
      text: "Tutaj będą pojawiały się najważniejsze informacje, ogłoszenia oraz wiadomości dla członków MDP.",
      date: new Date().toLocaleDateString("pl-PL")
    }
  ],

  members: [
    {
      id: 1,
      name: "Członek MDP",
      role: "Członek"
    }
  ],

  users: [
    {
      id: 1,
      name: "Członek MDP",
      role: "member"
    },
    {
      id: 2,
      name: "Opiekun MDP",
      role: "guardian"
    },
    {
      id: 3,
      name: "Administrator",
      role: "admin"
    }
  ]

};


function loadData(){

  const saved = localStorage.getItem("mdpData");

  if(saved){

    try{
      return JSON.parse(saved);
    }catch(e){
      return JSON.parse(JSON.stringify(defaultData));
    }

  }

  return JSON.parse(JSON.stringify(defaultData));
}


let data = loadData();


function saveData(){
  localStorage.setItem("mdpData", JSON.stringify(data));
}


/* =========================================================
   LOGOWANIE
========================================================= */

function chooseRole(role){

  currentRole = role;

  document.querySelectorAll(".role-button").forEach(button=>{
    button.classList.remove("active");
  });

  const selected = document.querySelector(
    `.role-button[data-role="${role}"]`
  );

  if(selected){
    selected.classList.add("active");
  }

  document.getElementById("loginCode").value = "";
  document.getElementById("loginError").textContent = "";
}


function login(){

  const code = document.getElementById("loginCode").value.trim();

  if(code === CODES.member){

    currentRole = "member";

    currentUser = {
      name:"Członek MDP",
      role:"member"
    };

  }else if(code === CODES.guardian){

    currentRole = "guardian";

    currentUser = {
      name:"Opiekun MDP",
      role:"guardian"
    };

  }else if(code === CODES.admin){

    currentRole = "admin";

    currentUser = {
      name:"Administrator",
      role:"admin"
    };

  }else{

    document.getElementById("loginError").textContent =
      "Nieprawidłowy kod dostępu.";

    return;
  }

  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  document.getElementById("topUserName").textContent =
    currentUser.name;

  document.getElementById("topRole").textContent =
    roleName(currentRole).toUpperCase();

  showPage("home");
}


function logout(){

  currentUser = {
    name:"Członek MDP",
    role:"member"
  };

  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");

  document.getElementById("loginCode").value = "";

  chooseRole("member");
}


/* =========================================================
   ROLE
========================================================= */

function roleName(role){

  if(role === "admin") return "Administrator";
  if(role === "guardian") return "Opiekun MDP";
  return "Członek MDP";
}


function isGuardian(){

  return currentRole === "guardian" ||
         currentRole === "admin";
}


function isAdmin(){

  return currentRole === "admin";
}


/* =========================================================
   NAWIGACJA
========================================================= */

function showPage(page){

  document.querySelectorAll(".nav-btn").forEach(button=>{
    button.classList.remove("active");
  });

  const active = document.querySelector(
    `.nav-btn[data-page="${page}"]`
  );

  if(active){
    active.classList.add("active");
  }

  if(page === "home") renderHome();
  if(page === "events") renderEvents();
  if(page === "news") renderNews();
  if(page === "members") renderMembers();
  if(page === "profile") renderProfile();

}


/* =========================================================
   HOME
========================================================= */

function renderHome(){

  const nextEvent = [...data.events]
    .sort((a,b)=>
      new Date(a.date + "T" + a.time) -
      new Date(b.date + "T" + b.time)
    )
    .find(event=>
      new Date(event.date + "T" + event.time) >= new Date()
    );

  const latestNews = data.news[data.news.length - 1];

  let html = `

    <div class="greeting">
      <small>Witaj ponownie 👋</small>
      <h1>${escapeHtml(currentUser.name)}</h1>
    </div>

  `;


  if(nextEvent){

    html += `

      <div class="hero">

        <div class="hero-label">
          Najbliższa zbiórka
        </div>

        <h2>${escapeHtml(nextEvent.title)}</h2>

        <p>
          📅 ${formatDate(nextEvent.date)}
          • ⏰ ${escapeHtml(nextEvent.time)}
        </p>

        <p>
          📍 ${escapeHtml(nextEvent.place)}
        </p>

        <div class="event-actions">

          <button class="btn" onclick="showPage('events')">
            Zobacz szczegóły
          </button>

        </div>

      </div>

    `;

  }else{

    html += `

      <div class="hero">

        <div class="hero-label">
          MDP OSP Wiesiółka
        </div>

        <h2>Brak zaplanowanych zbiórek</h2>

        <p>
          Gdy opiekun doda nową zbiórkę, pojawi się tutaj.
        </p>

      </div>

    `;

  }


  html += `

    <div class="cards">

      <div class="card">
        <div class="card-icon">📅</div>
        <div class="card-number">${data.events.length}</div>
        <div class="card-label">Zbiórek</div>
      </div>

      <div class="card">
        <div class="card-icon">📢</div>
        <div class="card-number">${data.news.length}</div>
        <div class="card-label">Ogłoszeń</div>
      </div>

      <div class="card">
        <div class="card-icon">👥</div>
        <div class="card-number">${data.members.length}</div>
        <div class="card-label">Członków</div>
      </div>

      <div class="card">
        <div class="card-icon">🧑‍🚒</div>
        <div class="card-number">
          ${data.users.filter(u=>u.role==="guardian").length}
        </div>
        <div class="card-label">Opiekunów</div>
      </div>

    </div>

  `;


  html += `

    <div class="section-title">
      <h2>Najnowsze ogłoszenie</h2>
      <span>Informacje</span>
    </div>

  `;


  if(latestNews){

    html += `

      <div class="news">

        <div class="news-date">
          ${escapeHtml(latestNews.date)}
        </div>

        <h3>${escapeHtml(latestNews.title)}</h3>

        <p>${escapeHtml(latestNews.text)}</p>

      </div>

    `;

  }


  if(isGuardian()){

    html += `

      <div class="section-title">
        <h2>Panel opiekuna</h2>
      </div>

      <div class="admin-box">

        <div class="admin-title">
          <span>🧑‍🚒</span>
          <h3>Funkcje opiekuna</h3>
        </div>

        <div class="event-actions">

          <button class="btn red" onclick="openEventModal()">
            ➕ Dodaj zbiórkę
          </button>

          <button class="btn" onclick="openNewsModal()">
            📢 Dodaj ogłoszenie
          </button>

          <button class="btn" onclick="showPage('members')">
            👥 Zarządzaj MDP
          </button>

        </div>

      </div>

    `;

  }


  if(isAdmin()){

    html += `

      <div class="section-title">
        <h2>Panel administratora</h2>
      </div>

      <div class="admin-box">

        <div class="admin-title">
          <span>🛡️</span>
          <h3>Administracja</h3>
        </div>

        <p style="color:#999;font-size:13px">

/* =========================================================

function renderEvents(){

  let html = `

    <div class="section-title">

      <h2>Zbiórki</h2>

      <span>
        ${data.events.length}
      </span>

    </div>

  `;


  if(isGuardian()){

    html += `

      <button
        class="btn red"
        onclick="openEventModal()"
        style="width:100%;margin-bottom:14px"
      >
        ➕ Dodaj nową zbiórkę
      </button>

    `;

  }


  const events = [...data.events].sort(
    (a,b)=>
      new Date(a.date+"T"+a.time) -
      new Date(b.date+"T"+b.time)
  );


  if(events.length === 0){

    html += `
      <div class="empty">
        Brak zaplanowanych zbiórek.
      </div>
    `;

  }


  events.forEach(event=>{

    const myAttendance =
      event.attendance?.[currentUser.name] || "";

    html += `

      <div class="event">

        <div class="event-top">

          <div>

            <div class="event-date">
              ${formatDate(event.date)}
              • ${escapeHtml(event.time)}
            </div>

            <h3>${escapeHtml(event.title)}</h3>

          </div>

        </div>

        <p>📍 ${escapeHtml(event.place)}</p>

        <p>${escapeHtml(event.description || "")}</p>

        <div class="event-actions">

          <button
            class="btn ${myAttendance==="Będę"?"green":""}"
            onclick="setAttendance(${event.id},'Będę')"
          >
            ✅ Będę
          </button>

          <button
            class="btn ${myAttendance==="Nie wiem"?"yellow":""}"
            onclick="setAttendance(${event.id},'Nie wiem')"
          >
            🤔 Nie wiem
          </button>

          <button
            class="btn ${myAttendance==="Nie będę"?"danger":""}"
            onclick="setAttendance(${event.id},'Nie będę')"
          >
            ❌ Nie będę
          </button>

        </div>

        ${
          myAttendance
          ? `<p style="color:#aaa;margin-top:12px">
              Twoja odpowiedź: <strong>${myAttendance}</strong>
             </p>`
          : ""
        }

    `;


    if(isGuardian()){

      html += `

        <div class="event-actions">

          <button
            class="btn"
            onclick="showAttendance(${event.id})"
          >
            👥 Obecność
          </button>

          <button
            class="btn danger"
            onclick="deleteEvent(${event.id})"
          >
            🗑️ Usuń
          </button>

        </div>

      `;

    }


    html += `</div>`;

  });


  document.getElementById("mainContent").innerHTML = html;
}


function setAttendance(eventId,status){

  const event = data.events.find(e=>e.id === eventId);

  if(!event) return;

  if(!event.attendance){
    event.attendance = {};
  }

  event.attendance[currentUser.name] = status;

  saveData();

  renderEvents();
}


function showAttendance(eventId){

  const event = data.events.find(e=>e.id===eventId);

  if(!event) return;

  let html = "";

  const attendance = event.attendance || {};

  const entries = Object.entries(attendance);

  if(entries.length === 0){

    html = `
      <div class="empty">
        Nikt jeszcze nie zaznaczył obecności.
      </div>
    `;

  }else{

    entries.forEach(([name,status])=>{

      html += `

        <div class="member">

          <div class="member-avatar">
            ${status==="Będę"?"✓":status==="Nie będę"?"×":"?"}
          </div>

          <div>

            <div class="member-name">
              ${escapeHtml(name)}
            </div>

            <div class="member-role">
              ${escapeHtml(status)}
            </div>

          </div>

        </div>

      `;

    });

  }

  openModal(
    "Obecność — " + event.title,
    html
  );
}


function deleteEvent(id){

  if(!confirm("Usunąć tę zbiórkę?")) return;

  data.events = data.events.filter(e=>e.id!==id);

  saveData();

  renderEvents();
}

/* =========================================================

========================================================= */

function openModal(title,content){

  document.getElementById("modalTitle").textContent = title;

  document.getElementById("modalContent").innerHTML = content;

  document.getElementById("modal").classList.remove("hidden");
}


function closeModal(){

  document.getElementById("modal").classList.add("hidden");

}


/* =========================================================
   POMOCNICZE
========================================================= */

function formatDate(date){

  if(!date) return "";

  const d = new Date(date + "T00:00:00");

  return d.toLocaleDateString("pl-PL",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}


function getInitials(name){

  if(!name) return "?";

  return name
    .split(" ")
    .filter(Boolean)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();
}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
