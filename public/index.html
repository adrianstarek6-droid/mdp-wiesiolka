<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d71920">
<link rel="manifest" href="/manifest.json">
<title>MDP OSP Wiesiółka</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.wrap{max-width:700px;margin:auto;padding:20px 16px 90px}.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:18px;margin:12px 0}
h1,h2,h3{margin-top:0}.red{color:#e3262e}.muted{color:#aaa}.btn{border:0;border-radius:12px;padding:12px 15px;background:#d71920;color:white;font-weight:700;margin:4px}.btn.dark{background:#292929}.btn.full{width:100%}
input,textarea,select{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#101010;color:#fff;margin:6px 0 10px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(460px,100%);background:#111;border:1px solid #292929;border-radius:24px;padding:24px}
.role{display:flex;gap:8px;flex-wrap:wrap}.role button{flex:1;min-width:100px}
nav{position:fixed;bottom:0;left:0;right:0;background:#101010;border-top:1px solid #292929;display:flex;justify-content:center;z-index:5}
nav button{background:none;border:0;color:#bbb;padding:12px 10px;font-size:12px}nav button.active{color:#fff}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#252525;color:#ddd;font-size:12px}
.item{border-top:1px solid #292929;padding:14px 0}.item:first-child{border-top:0}
.actions{display:flex;gap:6px;flex-wrap:wrap}.hidden{display:none}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="loginbox">
  <h1>🚒 <span class="red">MDP</span> Wiesiółka</h1>
  <p class="muted">Zaloguj się do aplikacji.</p>
  <div class="role">
   <button class="btn" onclick="setRole('member')">👤 Członek</button>
   <button class="btn" onclick="setRole('guardian')">🧑‍🚒 Opiekun</button>
   <button class="btn" onclick="setRole('admin')">🛠️ Admin</button>
  </div>
  <input id="code" type="password" placeholder="Kod dostępu">
  <button class="btn full" onclick="login()">Zaloguj</button>
  <p id="loginMsg" class="red"></p>
 </div>
</div>

<div id="app" class="hidden">
 <div class="wrap">
  <header>
   <h1>🚒 MDP <span class="red">Wiesiółka</span></h1>
   <p id="who" class="muted"></p>
  </header>

  <section id="home">
   <div class="card"><h2>Najbliższa zbiórka</h2><div id="next"></div></div>
   <div class="card"><h2>📢 Ostatnie ogłoszenia</h2><div id="latest"></div></div>
  </section>

  <section id="events" class="hidden"><h2>📅 Zbiórki</h2><div id="eventList"></div></section>
  <section id="news" class="hidden"><h2>📢 Ogłoszenia</h2><div id="newsList"></div></section>
  <section id="members" class="hidden"><h2>👥 Członkowie</h2><div id="memberList"></div></section>
  <section id="profile" class="hidden">
   <div class="card"><h2>👤 Mój profil</h2><p id="profileText"></p><button class="btn dark" onclick="logout()">Wyloguj</button></div>
  </section>

  <section id="manage" class="hidden">
   <h2>🛠️ Zarządzanie</h2>
   <div class="card">
    <h3>Dodaj zbiórkę</h3>
    <input id="etitle" placeholder="Nazwa zbiórki">
    <input id="edate" type="date"><input id="etime" type="time">
    <input id="eplace" placeholder="Miejsce">
    <textarea id="edesc" placeholder="Opis"></textarea>
    <button class="btn" onclick="addEvent()">Dodaj zbiórkę</button>
   </div>
   <div class="card">
    <h3>Dodaj ogłoszenie</h3>
    <input id="ntitle" placeholder="Tytuł">
    <textarea id="nbody" placeholder="Treść"></textarea>
    <button class="btn" onclick="addNews()">Dodaj ogłoszenie</button>
   </div>
   <div class="card">
    <h3>Dodaj członka</h3>
    <input id="mname" placeholder="Imię i nazwisko">
    <button class="btn" onclick="addMember()">Dodaj członka</button>
   </div>
  </section>
 </div>
 <nav>
  <button onclick="show('home')" id="n-home">🏠<br>Start</button>
  <button onclick="show('events')" id="n-events">📅<br>Zbiórki</button>
  <button onclick="show('news')" id="n-news">📢<br>Ogłoszenia</button>
  <button onclick="show('members')" id="n-members">👥<br>Osoby</button>
  <button onclick="show('profile')" id="n-profile">👤<br>Profil</button>
  <button id="n-manage" class="hidden" onclick="show('manage')">🛠️<br>Zarządzaj</button>
 </nav>
</div>

<script>
let role=null,code=null,data={events:[],news:[],members:[]};
const $=id=>document.getElementById(id);
function setRole(r){role=r; $("loginMsg").textContent="Wybrano: "+({member:"Członek MDP",guardian:"Opiekun MDP",admin:"Administrator"}[r]);$("code").focus()}
async function login(){
 code=$("code").value;
 try{
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({role,code})});
  const j=await r.json(); if(!r.ok) throw Error(j.error);
  localStorage.setItem("mdpRole",role); localStorage.setItem("mdpCode",code); start();
 }catch(e){$("loginMsg").textContent=e.message}
}
function headers(){return {"Content-Type":"application/json","x-role":role,"x-code":code}}
async function start(){
 $("login").classList.add("hidden");$("app").classList.remove("hidden");
 $("who").textContent=role==="member"?"Członek MDP":role==="guardian"?"Opiekun MDP":"Administrator";
 $("profileText").innerHTML="<b>Rola:</b> "+$("who").textContent+"<br><br>Twoje dane są zapisane na serwerze aplikacji.";
 if(role!=="member") $("n-manage").classList.remove("hidden");
 await load();show("home");
}
async function load(){
 const r=await fetch("/api/data",{headers:headers()}); data=await r.json(); render();
}
function render(){
 const next=data.events[0];
 $("next").innerHTML=next?`<b>${esc(next.title)}</b><br>📅 ${next.event_date} · ${next.event_time}<br>📍 ${esc(next.place)}<br><p>${esc(next.description||"")}</p>`:"Brak zaplanowanych zbiórek.";
 $("latest").innerHTML=data.news.slice(0,3).map(n=>`<div class="item"><b>${esc(n.title)}</b><p>${esc(n.body)}</p></div>`).join("")||"Brak ogłoszeń.";
 $("eventList").innerHTML=data.events.map(e=>`<div class="card"><h3>${esc(e.title)}</h3><span class="badge">${e.event_date} · ${e.event_time}</span><p>📍 ${esc(e.place)}</p><p>${esc(e.description||"")}</p><div class="actions"><button class="btn" onclick="att(${e.id},'yes')">✅ Będę</button><button class="btn dark" onclick="att(${e.id},'maybe')">❓ Nie wiem</button><button class="btn dark" onclick="att(${e.id},'no')">❌ Nie będę</button>${role!=="member"?`<button class="btn dark" onclick="delEvent(${e.id})">Usuń</button>`:""}</div></div>`).join("")||"Brak zbiórek.";
 $("newsList").innerHTML=data.news.map(n=>`<div class="card"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p>${role!=="member"?`<button class="btn dark" onclick="delNews(${n.id})">Usuń</button>`:""}</div>`).join("")||"Brak ogłoszeń.";
 $("memberList").innerHTML=data.members.map(m=>`<div class="card"><b>${esc(m.name)}</b><br><span class="muted">${esc(m.role)}</span>${role!=="member"?`<br><button class="btn dark" onclick="delMember(${m.id})">Usuń</button>`:""}</div>`).join("")||"Lista członków jest pusta.";
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function att(id,status){
 const name=prompt("Podaj swoje imię i nazwisko:"); if(!name)return;
 await fetch("/api/attendance",{method:"POST",headers:headers(),body:JSON.stringify({event_id:id,member_name:name,status})});
 alert("Obecność zapisana."); await load();
}
async function addEvent(){
 const body={title:$("etitle").value,event_date:$("edate").value,event_time:$("etime").value,place:$("eplace").value,description:$("edesc").value};
 const r=await fetch("/api/events",{method:"POST",headers:headers(),body:JSON.stringify(body)}); if(!r.ok)return alert((await r.json()).error);
 ["etitle","edate","etime","eplace","edesc"].forEach(x=>$(x).value="");await load();show("events");
}
async function addNews(){
 const r=await fetch("/api/news",{method:"POST",headers:headers(),body:JSON.stringify({title:$("ntitle").value,body:$("nbody").value})});
 if(!r.ok)return alert((await r.json()).error);$("ntitle").value="";$("nbody").value="";await load();show("news");
}
async function addMember(){
 const r=await fetch("/api/members",{method:"POST",headers:headers(),body:JSON.stringify({name:$("mname").value})});
 if(!r.ok)return alert((await r.json()).error);$("mname").value="";await load();show("members");
}
async function delEvent(id){if(confirm("Usunąć zbiórkę?")){await fetch("/api/events/"+id,{method:"DELETE",headers:headers()});await load()}}
async function delNews(id){if(confirm("Usunąć ogłoszenie?")){await fetch("/api/news/"+id,{method:"DELETE",headers:headers()});await load()}}
async function delMember(id){if(confirm("Usunąć członka?")){await fetch("/api/members/"+id,{method:"DELETE",headers:headers()});await load()}}
function show(id){
 ["home","events","news","members","profile","manage"].forEach(x=>$(x).classList.add("hidden"));
 $(id).classList.remove("hidden");
}
function logout(){localStorage.removeItem("mdpRole");localStorage.removeItem("mdpCode");location.reload()}
window.addEventListener("load",()=>{
 const r=localStorage.getItem("mdpRole"),c=localStorage.getItem("mdpCode");
 if(r&&c){role=r;code=c;start()}
 if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
});
</script>
</body>
</html>
